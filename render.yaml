services:
  - type: web
    name: maia-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /login.html
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Segredos: preencher no painel do Render (não vão para o Git)
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_HOST
        sync: false
      - key: ORACLE_PORT
        sync: false
      - key: ORACLE_SERVICE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: API_KEY
        sync: false
      # Gerado automaticamente pelo Render
      - key: JWT_SECRET_KEY
        generateValue: true
