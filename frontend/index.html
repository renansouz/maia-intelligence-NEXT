<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIA | Sompo Seguros</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/sompo-logo.webp" type="image/webp">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased bg-[#F9FAFB]">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <img src="assets/sompo-logo.webp" alt="Sompo Logo" class="h-8" onerror="this.style.display='none'">
                    <span class="text-xl font-extrabold tracking-tighter text-[#DF082A]">MAIA</span>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#operacional" id="nav-operacional" class="font-semibold transition">Operacional</a>
                    <a href="#gestao" id="nav-gestao" class="font-semibold transition">Gestão</a>
                    <a href="#diagnostico" id="nav-diagnostico" class="font-semibold transition">Diagnóstico XAI</a>
                    <a href="#compliance" id="nav-compliance" class="font-semibold transition border-l pl-8">Compliance</a>
                </div>
            </div>
        </div>
    </nav>

    <header id="hero-section" class="bg-[#DF082A] text-white py-16 px-4 transition-all duration-500">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl md:text-3xl font-extrabold mb-4 tracking-tighter">Monitoramento e Análise Inteligente Agrícola</h2>
            <p class="text-lg opacity-80 leading-relaxed max-w-4xl mx-auto">
                Inteligência preditiva e auditoria de riscos operacionais aplicada ao setor agrícola da Sompo Seguros. 
                Transformando dados climáticos e de telemetria em segurança para o patrimônio rural.
            </p>
        </div>
    </header>

    <main id="view-container" class="max-w-7xl mx-auto px-4 py-12 -mt-10">
        <section id="view-content" class="bg-white rounded-2xl p-8 shadow-xl border border-gray-100 min-h-[500px]">
        </section>
    </main>

    <script type="module">
        import { renderOperacional } from './js/operacional.js';
        import { renderGestao } from './js/gestao.js';
        import { renderDiagnostico } from './js/diagnostico.js';
        import { renderCompliance } from './js/compliance.js';

        const routes = {
            '#operacional': renderOperacional,
            '#gestao': renderGestao,
            '#diagnostico': renderDiagnostico,
            '#compliance': renderCompliance
        };

        function router() {
            const hash = window.location.hash || '#operacional';
            const renderFunc = routes[hash] || renderOperacional;
            const hero = document.getElementById('hero-section');

            if (hash === '#operacional') {
                hero.style.display = 'block';
            } else {
                hero.style.display = 'none';
            }

            Object.keys(routes).forEach(routeId => {
                const el = document.querySelector(`a[href="${routeId}"]`);
                if (routeId === hash) {
                    el.classList.add('text-[#DF082A]');
                    el.classList.remove('text-gray-500');
                } else {
                    el.classList.remove('text-[#DF082A]');
                    el.classList.add('text-gray-500');
                }
            });

            renderFunc();
        }

        window.addEventListener('hashchange', router);
        
        window.addEventListener('DOMContentLoaded', () => {
            router();
            lucide.createIcons();
        });
    </script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
</body>
</html>
